<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="100%" height="100%">
  <defs>
    <!-- Radial Gradients for 3D Movie Fur Effect -->
    <radialGradient id="headFur" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8d522a"/>
      <stop offset="60%" stop-color="#5a3116"/>
      <stop offset="100%" stop-color="#341b0b"/>
    </radialGradient>

    <radialGradient id="earFurL" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#91562d"/>
      <stop offset="65%" stop-color="#5d3317"/>
      <stop offset="100%" stop-color="#30190a"/>
    </radialGradient>

    <radialGradient id="earFurR" cx="55%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#91562d"/>
      <stop offset="65%" stop-color="#5d3317"/>
      <stop offset="100%" stop-color="#30190a"/>
    </radialGradient>

    <radialGradient id="innerEar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d89762"/>
      <stop offset="70%" stop-color="#a66436"/>
      <stop offset="100%" stop-color="#5c3418"/>
    </radialGradient>

    <radialGradient id="faceSkin3D" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fce2cd"/>
      <stop offset="60%" stop-color="#f5be93"/>
      <stop offset="100%" stop-color="#d68f5c"/>
    </radialGradient>

    <radialGradient id="eyeHazel" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9e7330"/>
      <stop offset="40%" stop-color="#5e3c14"/>
      <stop offset="85%" stop-color="#241305"/>
      <stop offset="100%" stop-color="#0d0601"/>
    </radialGradient>

    <radialGradient id="nose3D" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#524a46"/>
      <stop offset="50%" stop-color="#1f1a17"/>
      <stop offset="100%" stop-color="#080605"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Ground Soft Shadow -->
  <ellipse cx="300" cy="510" rx="160" ry="25" fill="#000000" opacity="0.5"/>

  <!-- Left Fluffy Ear 3D -->
  <g id="leftEar3D">
    <ellipse cx="125" cy="230" rx="115" ry="110" fill="url(#earFurL)" filter="url(#softShadow)"/>
    <!-- Fur rim texture strands -->
    <ellipse cx="125" cy="230" rx="100" ry="95" fill="url(#innerEar)" opacity="0.85"/>
    <path d="M 80 160 C 50 200, 50 260, 90 290 C 130 310, 150 260, 120 220 C 95 190, 105 160, 125 150" fill="none" stroke="#42220d" stroke-width="8" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Right Fluffy Ear 3D -->
  <g id="rightEar3D">
    <ellipse cx="475" cy="230" rx="115" ry="110" fill="url(#earFurR)" filter="url(#softShadow)"/>
    <ellipse cx="475" cy="230" rx="100" ry="95" fill="url(#innerEar)" opacity="0.85"/>
    <path d="M 520 160 C 550 200, 550 260, 510 290 C 470 310, 450 260, 480 220 C 505 190, 495 160, 475 150" fill="none" stroke="#42220d" stroke-width="8" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Feet 3D -->
  <ellipse cx="250" cy="485" rx="45" ry="25" fill="url(#headFur)"/>
  <ellipse cx="350" cy="485" rx="45" ry="25" fill="url(#headFur)"/>

  <!-- Body 3D -->
  <path d="M 230 280 C 200 360, 210 470, 250 480 L 350 480 C 390 470, 400 360, 370 280 Z" fill="url(#headFur)" filter="url(#softShadow)"/>

  <!-- Tummy Chest Fur -->
  <ellipse cx="300" cy="380" rx="36" ry="55" fill="url(#faceSkin3D)"/>

  <!-- Arms/Paws -->
  <path d="M 235 290 C 205 320, 200 380, 220 410 C 235 430, 250 400, 240 370" fill="url(#headFur)" stroke="#2b1406" stroke-width="3"/>
  <path d="M 365 290 C 395 320, 400 380, 380 410 C 365 430, 350 400, 360 370" fill="url(#headFur)" stroke="#2b1406" stroke-width="3"/>

  <!-- Head 3D Fur Hood -->
  <ellipse cx="300" cy="180" rx="135" ry="125" fill="url(#headFur)" filter="url(#softShadow)"/>

  <!-- Soft Fur Tuft on Head -->
  <path d="M 285 55 C 295 40, 305 40, 315 55 C 325 45, 335 50, 330 65 C 310 60, 290 60, 285 55 Z" fill="#91562d"/>

  <!-- Face 3D Fur Oval -->
  <ellipse cx="300" cy="185" rx="96" ry="84" fill="url(#faceSkin3D)"/>

  <!-- Eyebrows 3D -->
  <path d="M 220 122 C 235 105, 255 108, 265 120" fill="none" stroke="#3d1f0b" stroke-width="7" stroke-linecap="round"/>
  <path d="M 335 120 C 345 108, 365 105, 380 122" fill="none" stroke="#3d1f0b" stroke-width="7" stroke-linecap="round"/>

  <!-- Left Eye 3D Movie Glossy -->
  <g transform="translate(242, 160)">
    <ellipse cx="0" cy="0" rx="26" ry="32" fill="#140a03"/>
    <ellipse cx="0" cy="0" rx="24" ry="30" fill="url(#eyeHazel)"/>
    <ellipse cx="2" cy="-2" rx="15" ry="20" fill="#0a0501"/>
    <!-- Realistic Glare Highlights -->
    <ellipse cx="-7" cy="-10" rx="7" ry="5" fill="#ffffff" opacity="0.9" transform="rotate(-20)"/>
    <circle cx="6" cy="8" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="-8" cy="6" r="2" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Right Eye 3D Movie Glossy -->
  <g transform="translate(358, 160)">
    <ellipse cx="0" cy="0" rx="26" ry="32" fill="#140a03"/>
    <ellipse cx="0" cy="0" rx="24" ry="30" fill="url(#eyeHazel)"/>
    <ellipse cx="-2" cy="-2" rx="15" ry="20" fill="#0a0501"/>
    <!-- Realistic Glare Highlights -->
    <ellipse cx="-9" cy="-10" rx="7" ry="5" fill="#ffffff" opacity="0.9" transform="rotate(-20)"/>
    <circle cx="4" cy="8" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="-10" cy="6" r="2" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Nose 3D Button -->
  <path d="M 300 180 Q 288 198 300 202 Q 312 198 300 180 Z" fill="url(#nose3D)"/>
  <ellipse cx="296" cy="186" rx="3" ry="2" fill="#ffffff" opacity="0.6"/>

  <!-- Cute Sweet Smile -->
  <path d="M 288 222 Q 300 232 312 222" fill="none" stroke="#8a2016" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Soft Rosy Cheeks -->
  <ellipse cx="225" cy="202" rx="16" ry="10" fill="#e05343" opacity="0.22"/>
  <ellipse cx="375" cy="202" rx="16" ry="10" fill="#e05343" opacity="0.22"/>
</svg>
